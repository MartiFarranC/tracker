name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSIO_CODI: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Tests unitaris
        run: ./gradlew :app:testDebugUnitTest

      - name: APK de prova
        uses: actions/upload-artifact@v4
        with:
          name: tracker-debug
          path: app/build/outputs/apk/debug/*.apk

      # A main, l'APK es publica a la versió «prova», per baixar-la directament des del mòbil.
      - name: Publica l'APK de prova
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tracker.apk
          gh release delete prova --cleanup-tag --yes || true
          gh release create prova tracker.apk --title "Versió de prova (${{ github.run_number }})" \
            --notes "APK de prova compilada a partir de ${{ github.sha }}. Instal·la-la des del mòbil." --prerelease

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: app/build/reports/
