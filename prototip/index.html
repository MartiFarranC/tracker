<title>Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* Disposició: una columna de mòbil (màx. 440px), com l'app Android. Estètica de la casa (municipis, Andana) en versió app. */
:root {
  --fons: #FFFFFF; --sup: #F5F5F5; --sup2: #ECECEC; --linia: #E4E4E4;
  --tinta: #111111; --sec: #6B6B6B; --fort: #3DDC97; --tinta-fort: #111111;
  --fort-suau: #D4F6E7; --error: #C62D1F;
  --titol: "Archivo Black", "Arial Black", Impact, sans-serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ma: "Caveat", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fons: #0F0F0F; --sup: #1A1A1A; --sup2: #242424; --linia: #2A2A2A;
  --tinta: #F2F2F2; --sec: #9A9A9A; --fort-suau: #193A2C; --error: #F08A7A; color-scheme: dark } }
:root[data-theme="dark"] {
  --fons: #0F0F0F; --sup: #1A1A1A; --sup2: #242424; --linia: #2A2A2A;
  --tinta: #F2F2F2; --sec: #9A9A9A; --fort-suau: #193A2C; --error: #F08A7A; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--fons); color: var(--tinta); font-family: var(--text); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding-block: 16px 24px }
h1, h2, h3 { font-family: var(--titol); font-weight: 400; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
h1 { font-size: 32px; line-height: 1.05 }
h2 { font-size: 24px; line-height: 1.15 }
.etiqueta { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sec) }
.petit { font-size: 13px; color: var(--sec) }
.pila { display: flex; flex-direction: column; gap: 12px }
.fila { display: flex; gap: 10px; align-items: center }
.fila > * { min-width: 0 }
.creix { flex: 1 }

/* Botons: vora de 2px i ombra dura; en prémer, s'enfonsen. */
.boto { --o: 3px; font: 700 15px/1.2 var(--text); color: var(--tinta); background: var(--fons); border: 2px solid var(--tinta);
  box-shadow: var(--o) var(--o) 0 var(--tinta); padding: 12px 16px; min-height: 48px; cursor: pointer; width: 100%;
  transition: transform 70ms, box-shadow 70ms; margin: 0 var(--o) var(--o) 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.boto:active { transform: translate(var(--o), var(--o)); box-shadow: 0 0 0 var(--tinta) }
.boto:focus-visible, .fila-seg:focus-visible, .plantilla:focus-visible { outline: 3px solid var(--fort); outline-offset: 2px }
.boto.principal { background: var(--fort); color: var(--tinta-fort); min-height: 56px; font-size: 16px }
.boto.sec { --o: 2px; min-height: 44px }
.boto.icona { width: 46px; min-height: 46px; padding: 0; --o: 2px; font-size: 20px; flex: none }
.boto.perill { color: var(--error) }
.boto-text { background: none; border: 0; font: 700 14px var(--text); color: var(--tinta); padding: 8px 10px; cursor: pointer }
.boto-text.sec { color: var(--sec) }
.contesta { display: inline-block; animation: puja 240ms ease-out }
@keyframes puja { from { transform: translateY(70%); opacity: 0 } to { transform: none; opacity: 1 } }

/* Inici */
.capcalera { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px }
.placa { font: 700 11px var(--text); letter-spacing: .1em; background: var(--fort); color: var(--tinta-fort); border: 1.5px solid var(--tinta); padding: 2px 6px }
.fila-seg { display: flex; align-items: stretch; border: 1.5px solid var(--linia); background: var(--fons); cursor: pointer; text-align: left;
  font: inherit; color: inherit; padding: 0; width: calc(100% - 3px); margin: 0 3px 3px 0 }
.fila-seg.toca { border: 2px solid var(--tinta); box-shadow: 3px 3px 0 var(--tinta) }
.xifra { width: 92px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--sup); padding: 10px 4px; min-height: 96px }
.toca .xifra { background: var(--fort-suau) }
.xifra span { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase }
.grafic { position: relative; display: grid; place-items: center }
.grafic svg { display: block }
.grafic b { position: absolute; inset: 0; display: grid; place-items: center; font: 400 20px/1 var(--titol); font-variant-numeric: tabular-nums }
.grafic.gran b { font-size: 40px; flex-direction: column }
.grafic.gran small { display: block; font: 700 11px var(--text); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px }
.visual { display: flex; flex-direction: column; gap: 10px }
.caixes { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end }
.blister { display: grid; gap: 5px; padding: 8px; border: 2px solid var(--tinta); background: var(--sup); width: max-content; max-width: 100% }
.blister i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--linia); display: block }
.blister i.ple { background: var(--fort); border-color: var(--tinta) }
.calendari { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px }
.calendari div { aspect-ratio: 1; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1.5px solid transparent; font-variant-numeric: tabular-nums; max-width: 100% }
.calendari .cap { aspect-ratio: auto; font-size: 10px; color: var(--sec); font-weight: 700 }
.calendari .passat { color: var(--sec); opacity: .5 }
.calendari .te { background: var(--sup2) }
.calendari .avisa { background: var(--fort) ; color: var(--tinta-fort) }
.calendari .sense { border: 1.5px dashed var(--sec); color: var(--sec) }
.calendari .avui { border: 2.5px solid var(--tinta) }
.llegenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--sec) }
.llegenda span { display: inline-flex; align-items: center; gap: 6px }
.llegenda i { width: 12px; height: 12px; display: inline-block; border: 1.5px solid transparent }
.barres { display: flex; align-items: flex-end; gap: 6px; height: 120px; position: relative; border-bottom: 2px solid var(--tinta); padding-top: 18px }
.barres > div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0 }
.barres i { display: block; width: 100%; max-width: 34px; background: var(--tinta) }
.barres .ultima i { background: var(--fort); border: 2px solid var(--tinta) }
.barres small { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums }
.barres .mitjana { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--sec); height: 0; pointer-events: none }
.barres .mitjana span { position: absolute; right: 0; top: -18px; font-size: 11px; font-weight: 700; color: var(--sec); background: var(--fons); padding: 0 4px }
.eixos { display: flex; gap: 6px; font-size: 10px; color: var(--sec) }
.eixos span { flex: 1; text-align: center; min-width: 0; overflow: hidden; white-space: nowrap }
.cos-seg { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.cos-seg h3 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.buit { text-align: center; padding: 40px 0 }
.buit p:first-child { font-family: var(--ma); font-size: 28px; margin: 0 }
.peu { position: sticky; bottom: 0; background: var(--fons); padding-top: 12px; padding-bottom: env(safe-area-inset-bottom, 0px) }

/* El simulador de dies, només al prototip */
.simulador { border: 1.5px dashed var(--sec); padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 8px }
.simulador .fila { flex-wrap: wrap }
.simulador .boto { width: auto; flex: 1 }
.avisos { border: 2px solid var(--tinta); background: var(--sup); padding: 12px; display: flex; flex-direction: column; gap: 6px }
.avis { display: flex; gap: 10px; align-items: flex-start }
.avis::before { content: ""; width: 10px; height: 10px; background: var(--fort); border: 1.5px solid var(--tinta); flex: none; margin-top: 5px }

/* Targetes del detall */
.targeta { border: 1.5px solid var(--tinta); padding: 16px; display: flex; flex-direction: column; gap: 4px; background: var(--fons) }
.targeta.toca { background: var(--fort); color: var(--tinta-fort); box-shadow: 3px 3px 0 var(--tinta); margin: 0 3px 3px 0 }
.targeta.toca .etiqueta, .targeta.toca .petit { color: var(--tinta-fort) }
.historial { display: flex; flex-direction: column }
.historial > div { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linia) }
.historial b { font-weight: 700 }

/* Plantilles */
.plantilla { border: 1.5px solid var(--linia); padding: 14px 16px; text-align: left; background: var(--fons); color: inherit; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px }
.plantilla:last-child { border-color: var(--tinta) }
.plantilla h3 { font-size: 18px }

/* Formulari */
label.camp { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sec); flex: 1; min-width: 0 }
label.camp input { font: 16px var(--text); color: var(--tinta); background: var(--fons); border: 1.5px solid var(--sec); padding: 12px; border-radius: 0; width: 100% }
label.camp input:focus { outline: none; border: 2px solid var(--tinta); padding: 11.5px }
.interruptor { display: flex; gap: 12px; align-items: center; padding: 8px 0; cursor: pointer }
.interruptor input { appearance: none; width: 48px; height: 28px; border: 2px solid var(--tinta); background: var(--fons); position: relative; flex: none; cursor: pointer; margin: 0 }
.interruptor input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--tinta); transition: left 120ms }
.interruptor input:checked { background: var(--fort) }
.interruptor input:checked::after { left: 23px; background: var(--tinta-fort) }
.interruptor input:focus-visible { outline: 3px solid var(--fort); outline-offset: 2px }
.interruptor b { display: block; font-size: 16px }
hr { border: 0; border-top: 1px solid var(--linia); margin: 8px 0; width: 100% }
.error { color: var(--error); font-weight: 600 }

/* Diàlegs com a full inferior */
.vel { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)) }
.dialeg { background: var(--fons); border: 2px solid var(--tinta); box-shadow: 4px 4px 0 var(--tinta); padding: 18px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px }
.dialeg .accions { display: flex; justify-content: flex-end; gap: 4px }
@media (prefers-reduced-motion: reduce) { .contesta { animation: none } .boto { transition: none } }
</style>

<div id="app"></div>

<script>
"use strict";
// ---------- Regles (les mateixes que domini/Calculs.kt de l'app) ----------
const EPS = 1e-9;
const consumsFins = (dia, inici, cada) => dia < inici ? 0 : Math.floor((dia - inici) / Math.max(1, cada)) + 1;
function unitatsAvui(s, avui) {
  const c = Math.max(0, consumsFins(avui, s.consumInici, s.consumCadaDies) - consumsFins(s.estocData, s.consumInici, s.consumCadaDies));
  return Math.max(0, s.estocUnitats - c * s.consumQuantitat);
}
function estoc(s, avui) {
  const unitats = unitatsAvui(s, avui);
  if (s.consumQuantitat <= 0) return { unitats, dies: null, finsAl: null, estat: "BE" };
  const cada = Math.max(1, s.consumCadaDies);
  const vegades = Math.floor(unitats / s.consumQuantitat + EPS);
  const fets = consumsFins(avui, s.consumInici, cada);
  const finsAl = s.consumInici + (fets + vegades) * cada - 1;
  const dies = finsAl - avui;
  const estat = dies <= s.avisEstocDies ? "TOCA" : dies <= s.avisEstocDies * 2 ? "AVIAT" : "BE";
  return { unitats, dies, finsAl, estat };
}
function resumRegistres(s, regs, avui) {
  const dies = regs.map(r => r.data).sort((a, b) => a - b);
  const ints = []; for (let i = 1; i < dies.length; i++) if (dies[i] - dies[i - 1] > 0) ints.push(dies[i] - dies[i - 1]);
  const mitjana = ints.length ? ints.reduce((a, b) => a + b, 0) / ints.length : null;
  const interval = s.intervalFixDies > 0 ? s.intervalFixDies : mitjana != null ? Math.max(1, Math.round(mitjana)) : null;
  const darrer = dies.length ? dies[dies.length - 1] : null;
  const propera = darrer != null && interval != null ? darrer + interval : null;
  const falten = propera != null ? propera - avui : null;
  const valors = regs.map(r => r.valor).filter(v => v != null);
  const estat = falten == null ? "SENSE" : falten <= s.avisAbansDies ? "TOCA" : falten <= s.avisAbansDies + Math.max(3, Math.floor(interval / 5)) ? "AVIAT" : "BE";
  return { nombre: dies.length, darrer, desDe: darrer != null ? avui - darrer : null, mitjana, interval, propera, falten,
    mitjanaValor: valors.length ? valors.reduce((a, b) => a + b, 0) / valors.length : null,
    totalValor: valors.length ? valors.reduce((a, b) => a + b, 0) : null, estat };
}
const ORDRE = { TOCA: 0, AVIAT: 1, BE: 2, SENSE: 3 };
function resum(s, avui) {
  const regs = dades.registres.filter(r => r.seguimentId === s.id).sort((a, b) => b.data - a.data);
  const e = s.ambEstoc ? estoc(s, avui) : null;
  const rr = s.ambRegistres ? resumRegistres(s, regs, avui) : null;
  const estats = [e && e.estat, rr && rr.estat].filter(Boolean);
  const estat = estats.sort((a, b) => ORDRE[a] - ORDRE[b])[0] || "SENSE";
  const u = [e && e.dies != null ? e.dies - s.avisEstocDies : null, rr && rr.falten != null ? rr.falten - s.avisAbansDies : null].filter(x => x != null);
  return { s, regs, e, rr, estat, urgencia: u.length ? Math.min(...u) : Infinity };
}
function enPaquets(u, per) { if (per <= 0) return [0, u]; const p = Math.floor(u / per + EPS); return [p, Math.max(0, u - p * per)] }
function plural(n) {
  n = (n || "").trim(); const m = n.toLowerCase(); if (!n) return n;
  if (m.endsWith("ca")) return n.slice(0, -2) + "ques"; if (m.endsWith("ga")) return n.slice(0, -2) + "gues";
  if (m.endsWith("ça")) return n.slice(0, -2) + "ces"; if (m.endsWith("ja")) return n.slice(0, -2) + "ges";
  if (m.endsWith("a")) return n.slice(0, -1) + "es"; if (m.endsWith("ió")) return n.slice(0, -2) + "ions";
  if (m.endsWith("s") || m.endsWith("x")) return n; return n + "s";
}
const nom = (sing, q) => Math.abs(q - 1) < EPS ? sing : plural(sing);
const maj = t => t ? t[0].toUpperCase() + t.slice(1) : t;

// ---------- Format ----------
const fmtNum = new Intl.NumberFormat("ca", { maximumFractionDigits: 2 });
const xifra = n => fmtNum.format(n);
const dataDe = d => new Date(d * 86400000);
const dataCurta = (d) => dataDe(d).toLocaleDateString("ca", { day: "numeric", month: "short", timeZone: "UTC", ...(dataDe(d).getUTCFullYear() !== dataDe(avui()).getUTCFullYear() ? { year: "numeric" } : {}) });
const dataLlarga = d => maj(dataDe(d).toLocaleDateString("ca", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }));
const diesT = n => n === 1 ? "1 dia" : `${n} dies`;
const faT = n => n === 0 ? "Avui" : n === 1 ? "Ahir" : `Fa ${n} dies`;
const faltenT = n => n === 0 ? "avui" : n === 1 ? "demà" : n > 1 ? `d'aquí a ${n} dies` : `tocava fa ${diesT(-n)}`;
function textEstoc(s, u) {
  const [p, sol] = enPaquets(u, s.nomPaquet ? s.unitatsPerPaquet : 0);
  const tu = `${xifra(sol)} ${nom(s.nomUnitat, sol)}`;
  if (!p) return tu; const tp = `${p} ${nom(s.nomPaquet, p)}`;
  return sol <= 0 ? tp : `${tp} i ${tu}`;
}
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = t => { const v = parseFloat(String(t ?? "").trim().replace(",", ".")); return isNaN(v) ? null : v };

// ---------- Dades (al navegador, com Room al mòbil) ----------
const CLAU = "tracker-prototip-v1";
const avuiReal = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000) };
let dades;
function exemple() {
  const a = avuiReal(); let id = 1;
  const base = { detall: "", creat: a - 70, ambEstoc: false, nomUnitat: "", nomPaquet: "", unitatsPerPaquet: 0, consumQuantitat: 1, consumCadaDies: 1,
    consumInici: a - 70, estocUnitats: 0, estocData: a, avisEstocDies: 7, ambRegistres: false, intervalFixDies: null, avisAbansDies: 0, ambValor: false, unitatValor: "" };
  const seg = [
    { ...base, id: id++, nom: "Eutirox 100", detall: "Merck · 1 al matí", plantilla: "MEDICAMENT", ambEstoc: true, nomUnitat: "pastilla", nomPaquet: "caixa", unitatsPerPaquet: 28, estocUnitats: 37, estocData: a - 1, consumInici: a - 30 },
    { ...base, id: id++, nom: "Tallar-me el cabell", detall: "Barberia del barri", plantilla: "CABELL", ambRegistres: true },
    { ...base, id: id++, nom: "Gasolina", detall: "Moto", plantilla: "GASOLINA", ambRegistres: true, ambValor: true, unitatValor: "€" },
    { ...base, id: id++, nom: "Revisió del cotxe", detall: "Seat Ibiza", plantilla: "REVISIO", ambRegistres: true, intervalFixDies: 365, avisAbansDies: 30 },
    { ...base, id: id++, nom: "Lentilles", detall: "Mensuals", plantilla: "CONSUMIBLE", ambEstoc: true, nomUnitat: "parell", nomPaquet: "caixa", unitatsPerPaquet: 3, consumCadaDies: 30, estocUnitats: 2, estocData: a, consumInici: a - 5, avisEstocDies: 20 },
  ];
  const r = (s, d, valor = null) => ({ id: Math.random().toString(36).slice(2), seguimentId: s, data: a - d, valor, nota: "" });
  return { exemple: true, desplacament: 0, nextId: id, seguiments: seg,
    registres: [r(2, 92), r(2, 61), r(2, 29), r(3, 26, 18.5), r(3, 17, 21), r(3, 9, 19.8), r(4, 340)] };
}
function carrega() { try { const t = localStorage.getItem(CLAU); if (t) return JSON.parse(t) } catch (e) {} return exemple() }
function desa() { try { localStorage.setItem(CLAU, JSON.stringify(dades)) } catch (e) {} }
dades = carrega();
const avui = () => avuiReal() + (dades.desplacament || 0);

// ---------- Plantilles ----------
const PLANTILLES = [
  ["MEDICAMENT", "Medicament", "Pastilles que es gasten cada dia. T'avisa abans que s'acabin.", { ambEstoc: true, nomUnitat: "pastilla", nomPaquet: "caixa", unitatsPerPaquet: 28, avisEstocDies: 7 }],
  ["CONSUMIBLE", "Consumible", "Lentilles, càpsules, filtres… Qualsevol cosa que es gasta sola.", { ambEstoc: true, nomUnitat: "unitat", nomPaquet: "paquet", unitatsPerPaquet: 10, avisEstocDies: 5 }],
  ["CABELL", "Tallar-se el cabell", "Apunta cada cop. En farà la mitjana i t'avisarà quan toqui.", { nom: "Tallar-me el cabell", ambRegistres: true }],
  ["GASOLINA", "Gasolina", "Cada cop que poses benzina, amb els euros o els litres.", { nom: "Gasolina", ambRegistres: true, ambValor: true, unitatValor: "€" }],
  ["REVISIO", "Revisió del vehicle", "Cada any (o cada quan vulguis), amb un avís un mes abans.", { nom: "Revisió del cotxe", ambRegistres: true, intervalFixDies: 365, avisAbansDies: 30 }],
  ["METGE", "Visita mèdica", "Revisions periòdiques: el dentista, l'oculista, l'anàlisi…", { nom: "Visita mèdica", ambRegistres: true, intervalFixDies: 180, avisAbansDies: 14 }],
  ["PERSONALITZAT", "Personalitzat", "Des de zero: tria si té estoc, registres o totes dues coses.", { ambRegistres: true }],
];
function nouDePlantilla(clau) {
  const a = avui(), p = PLANTILLES.find(x => x[0] === clau);
  return { id: 0, nom: "", detall: "", plantilla: clau, creat: a, ambEstoc: false, nomUnitat: "", nomPaquet: "", unitatsPerPaquet: 0,
    consumQuantitat: 1, consumCadaDies: 1, consumInici: a, estocUnitats: 0, estocData: a, avisEstocDies: 7, ambRegistres: false,
    intervalFixDies: null, avisAbansDies: 0, ambValor: false, unitatValor: "", ...p[3] };
}

// ---------- Navegació ----------
let vista = { p: "inici" }, dialeg = null, fet = false;
const app = document.getElementById("app");
function ves(v) { vista = v; dialeg = null; pinta(); window.scrollTo(0, 0) }
function pinta() {
  app.innerHTML = vista.p === "inici" ? inici() : vista.p === "plantilla" ? triaPlantilla() : vista.p === "form" ? formulari() : detall();
  if (dialeg) app.insertAdjacentHTML("beforeend", dialeg.html);
}
function trobaSeg(id) { return dades.seguiments.find(s => s.id === id) }

// ---------- Gràfics ----------
/** Un anell que s'omple: el temps des de l'últim cop sobre cada quan toca. */
function anell(frac, mida, gruix, color, pista = "var(--linia)") {

    const tocaR = rr.estat === "TOCA", fr = rr.interval && rr.desDe != null ? rr.desDe / rr.interval : 0;
    h += `<div class="targeta ${tocaR ? "toca" : ""}"><div class="fila" style="align-items:center;gap:16px">
      <div class="grafic gran">${anell(fr, 116, 12, tocaR ? "var(--tinta)" : "var(--fort)", tocaR ? "rgb(0 0 0 / .15)" : "var(--sup2)")}<b><span style="display:flex;flex-direction:column;align-items:center">${rr.desDe ?? "—"}<small>${rr.interval ? `de ${rr.interval} dies` : "dies"}</small></span></b></div>
      <div class="creix" style="display:flex;flex-direction:column;gap:4px"><div class="etiqueta">L'últim cop</div><h2>${rr.desDe != null ? faT(rr.desDe) : "Mai"}</h2>
      <div style="font-size:16px">${linia}</div></div></div>${int ? `<div class="petit">${int}</div>` : ""}
      ${s.ambValor && rr.mitjanaValor != null ? `<div class="petit">Mitjana: ${xifra(rr.mitjanaValor)} ${esc(s.unitatValor)} · Total: ${xifra(rr.totalValor)} ${esc(s.unitatValor)}</div>` : ""}</div>
      <button class="boto principal" data-acc="avui">${fet ? `<span class="contesta">Fet!</span>` : "Ho he fet avui"}</button>
      <button class="boto sec" data-acc="altre">Un altre dia…</button>${visualRegistres(s, rr, r.regs)}`;
    if (r.regs.length) {
      h += `<div class="etiqueta" style="margin-top:8px">Historial</div><div class="historial">` + r.regs.map((g, i) => {
        const ant = r.regs[i + 1], parts = [];
        if (ant) parts.push(`+${g.data - ant.data} dies`); if (g.valor != null) parts.push(`${xifra(g.valor)} ${esc(s.unitatValor)}`); if (g.nota) parts.push(esc(g.nota));
        return `<div><div class="creix"><b>${dataCurta(g.data)}</b>${parts.length ? `<div class="petit">${parts.join(" · ")}</div>` : ""}</div><button class="boto-text sec" data-esborra-reg="${g.id}" aria-label="Esborra el registre">×</button></div>`;
      }).join("") + `</div>`;
    }
  }
  return h + `</div>`;
}

// ---------- Diàlegs ----------
function obreDialeg(titol, cos, accio, ok = "D'acord") {
  dialeg = { accio, html: `<div class="vel" data-tanca><div class="dialeg" role="dialog" aria-label="${esc(titol)}"><h2>${esc(titol)}</h2>${cos}
    <div class="accions"><button class="boto-text sec" data-acc="tanca">Cancel·la</button><button class="boto-text" data-acc="accepta">${ok}</button></div></div></div>` };
  pinta(); const i = app.querySelector(".dialeg input"); if (i) i.focus();
}
function dialegEstoc(s, titol, text, onTotal) {
  const amb = s.nomPaquet && s.unitatsPerPaquet > 0;
  obreDialeg(titol, `<div>${text}</div>${amb ? camp("dp", maj(plural(s.nomPaquet)), "", { n: true }) : ""}${camp("ds", amb ? maj(`${plural(s.nomUnitat)} soltes`) : maj(plural(s.nomUnitat)), "", { n: true })}`,
    () => onTotal((amb ? (num(document.getElementById("f-dp").value) ?? 0) * s.unitatsPerPaquet : 0) + (num(document.getElementById("f-ds").value) ?? 0)));
}
function registra(s, dia) {
  const fes = (v, n) => { afegeixRegistre(s.id, dia, v, n); dialeg = null; if (dia === avui()) { fet = true; setTimeout(() => { fet = false; if (vista.p === "detall") pinta() }, 1600) } pinta() };
  if (!s.ambValor) return fes(null, "");
  obreDialeg(dataLlarga(dia), camp("dv", `Xifra (${s.unitatValor})`, "", { n: true }) + camp("dn", "Nota (opcional)", ""),
    () => fes(num(document.getElementById("f-dv").value), document.getElementById("f-dn").value), "Desa");
}

// ---------- Esdeveniments ----------
app.addEventListener("change", ev => { if (ev.target.matches("[data-redibuixa]") && vista.p === "form") { llegeixForm(); pinta() } });
app.addEventListener("input", ev => { if (vista.p === "form" && /^f-(nomUnitat|nomPaquet)$/.test(ev.target.id)) { /* el text dels camps depèn d'aquests */ } });
app.addEventListener("focusout", ev => { if (vista.p === "form" && /^f-(nomUnitat|nomPaquet)$/.test(ev.target.id)) { llegeixForm(); pinta() } });
app.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-tanca]"); if (!t) return;
  if (t.matches("[data-tanca]") && ev.target !== t) return;
  if (t.matches("[data-tanca]")) { dialeg = null; pinta(); return }
  if (t.dataset.obre) return ves({ p: "detall", id: +t.dataset.obre });
  if (t.dataset.plantilla) return ves({ p: "form", f: { ...nouDePlantilla(t.dataset.plantilla), avuiJa: false } });
  if (t.dataset.esborraReg) {
    const g = dades.registres.find(x => x.id === t.dataset.esborraReg);
    return obreDialeg("Esborrar aquest registre?", `<div>${dataLlarga(g.data)}</div>`, () => { dades.registres = dades.registres.filter(x => x !== g); desa(); dialeg = null; pinta() }, "Esborra");
  }
  const s = vista.id ? trobaSeg(vista.id) : null;
  switch (t.dataset.acc) {
    case "nou": return ves({ p: "plantilla" });
    case "enrere": return ves(vista.p === "form" ? (vista.original ? { p: "detall", id: vista.original.id } : { p: "plantilla" }) : { p: "inici" });
    case "desa": return desaForm();
    case "edita": return ves({ p: "form", original: s, f: { ...s } });
    case "esborra": return obreDialeg(`Esborrar «${s.nom}»?`, `<div>S'esborrarà amb tot l'historial. No es pot desfer.</div>`, () => {
      dades.seguiments = dades.seguiments.filter(x => x.id !== s.id); dades.registres = dades.registres.filter(x => x.seguimentId !== s.id); desa(); ves({ p: "inici" }) }, "Esborra");
    case "menys": return canviaEstoc(s.id, u => u - 1);
    case "mes": return canviaEstoc(s.id, u => u + 1);
    case "compra": return dialegEstoc(s, "He comprat", "Quant n'has comprat? Se suma al que tens.", n => { dialeg = null; canviaEstoc(s.id, u => u + n) });
    case "corregeix": return dialegEstoc(s, "Corregeix", "Quant en tens exactament ara?", n => { dialeg = null; canviaEstoc(s.id, () => n) });
    case "avui": return registra(s, avui());
    case "altre": return obreDialeg("Quin dia va ser?", `<label class="camp" for="f-dd">Dia<input type="date" id="f-dd" max="${dataDe(avui()).toISOString().slice(0, 10)}" value="${dataDe(avui() - 1).toISOString().slice(0, 10)}"></label>`, () => {
      const v = document.getElementById("f-dd").value; if (!v) return; dialeg = null; registra(s, Math.floor(Date.parse(v) / 86400000)) });
    case "tanca": dialeg = null; return pinta();
    case "accepta": return dialeg && dialeg.accio();
    case "dia": dades.desplacament = (dades.desplacament || 0) + 1; desa(); return pinta();
    case "setmana": dades.desplacament = (dades.desplacament || 0) + 7; desa(); return pinta();
    case "real": dades.desplacament = 0; desa(); return pinta();
    case "buida": return obreDialeg("Esborrar-ho tot?", "<div>S'esborraran tots els seguiments d'aquest navegador.</div>", () => { dades = { exemple: false, desplacament: 0, nextId: 1, seguiments: [], registres: [] }; desa(); ves({ p: "inici" }) }, "Esborra");
    case "exemple": dades = exemple(); desa(); return ves({ p: "inici" });
  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && dialeg) { dialeg = null; pinta() } });
pinta();
</script>
